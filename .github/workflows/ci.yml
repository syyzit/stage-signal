name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install stage-signal with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

      - name: Run orchestrator smoke
        run: sh examples/orchestrator-smoke.sh

      - name: Run queue orchestrator smoke
        run: sh examples/queue-orchestrator-smoke.sh

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install stage-signal with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (spec gaps first)
        env:
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest tests/test_spec_gaps.py -vv --tb=short

      - name: Run pytest
        env:
          PYTHONFAULTHANDLER: "1"
        timeout-minutes: 10
        run: python -m pytest -q --tb=line

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build

      - name: Check distributions with twine
        run: twine check dist/*
