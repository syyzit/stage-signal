[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-signal"
version = "0.1.0"
description = "Tiny harness-agnostic stage lifecycle CLI for external agent orchestrators"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
stage-signal = "stage_signal.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
