name: 'stage-signal wait'
description: >-
  Wait on a stage-signal stage without a preinstalled venv.
  Installs stage-signal from PyPI then runs
  `stage-signal --dir <dir> wait --state <state> --timeout <timeout>`
  or `stage-signal --dir <dir> wait --needs-reclaim --timeout <timeout>`.
  Exposes step outputs (state, outcome, exit-code, timed-out, stage-id,
  reason, needs-reclaim, json) so downstream steps can branch on done /
  blocked / failed / timeout / reclaim-needed without scraping logs or
  collapsing 11/12/14/1 into a generic failure.
  Use `continue-on-error: true` on this step, then `if:` on `state` /
  `timed-out` / `needs-reclaim` / `reason` (see examples/github-action-wait.yml).
  Inputs: dir, state, timeout, poll, python-version, version, cache,
  cache-dependency-path, pip-cache, needs-reclaim.
  Exit codes: 0 done/OK (wait condition met, or needs_reclaim true),
  1 generic/corrupt/done-without-reclaim, 2 bad args, 3 illegal transition,
  10 running, 11 blocked, 12 failed, 13 queued, 14 wait timeout, 15 not initialized.
  Node runtime: uses actions/setup-python@v7 (Node 24 runner runtime).
inputs:
  dir:
    description: 'Stage dir (passed as --dir)'
    required: false
    default: '.stage-signal'
  state:
    description: 'State to wait for: done, blocked, failed, or terminal'
    required: false
    default: 'terminal'
  timeout:
    description: 'Wait timeout in seconds (passed as --timeout)'
    required: false
    default: '3600'
  poll:
    description: 'Poll interval in seconds (passed as --poll; default uses CLI default 5.0)'
    required: false
    default: ''
  needs-reclaim:
    description: 'Poll until needs_reclaim is true (DEAD_PID or STALE_HEARTBEAT) instead of waiting for a state ("true" or "false")'
    required: false
    default: 'false'
  python-version:
    description: 'Python version for actions/setup-python'
    required: false
    default: '3.12'
  version:
    description: >-
      stage-signal version to install from PyPI. A bare version ("1.0.0") is
      pinned with "=="; a constraint (">=1.0.0", "~=1.0.0") is passed through.
      Defaults to the version this action ref ships with. Pass "latest" to
      install the newest release instead.
    required: false
    default: '1.0.0'
  cache:
    description: 'Dependency cache for actions/setup-python (e.g. "pip", or "" to disable)'
    required: false
    default: ''
  cache-dependency-path:
    description: 'Path to dependency file(s) for actions/setup-python cache'
    required: false
    default: ''
  pip-cache:
    description: 'Boolean flag to enable pip caching via actions/setup-python ("true" or "false")'
    required: false
    default: 'false'
outputs:
  state:
    description: 'Observed stage state (e.g. done, blocked, failed, running)'
    value: ${{ steps.wait.outputs.state }}
  observed-state:
    description: 'Observed stage state (alias for state)'
    value: ${{ steps.wait.outputs.observed-state }}
  observed_state:
    description: 'Observed stage state (alias for state)'
    value: ${{ steps.wait.outputs.observed_state }}
  outcome:
    description: 'Wait outcome: met, mismatch, timeout, or error'
    value: ${{ steps.wait.outputs.outcome }}
  exit-code:
    description: 'Numeric exit code from stage-signal wait (0 met, 11 blocked, 12 failed, 14 timeout, 15 not initialized, etc.)'
    value: ${{ steps.wait.outputs.exit-code }}
  exit_code:
    description: 'Numeric exit code (alias for exit-code)'
    value: ${{ steps.wait.outputs.exit_code }}
  timed-out:
    description: 'Whether the wait timed out ("true" or "false")'
    value: ${{ steps.wait.outputs.timed-out }}
  timed_out:
    description: 'Whether the wait timed out (alias for timed-out)'
    value: ${{ steps.wait.outputs.timed_out }}
  stage-id:
    description: 'Stage ID observed from status if available'
    value: ${{ steps.wait.outputs.stage-id }}
  stage_id:
    description: 'Stage ID (alias for stage-id)'
    value: ${{ steps.wait.outputs.stage_id }}
  reason:
    description: 'Short blocked/failed reason or timeout message (empty otherwise)'
    value: ${{ steps.wait.outputs.reason }}
  needs-reclaim:
    description: 'Whether needs_reclaim was observed as true ("true" or "false")'
    value: ${{ steps.wait.outputs.needs-reclaim }}
  needs_reclaim:
    description: 'Whether needs_reclaim was observed as true (alias for needs-reclaim)'
    value: ${{ steps.wait.outputs.needs_reclaim }}
  json:
    description: 'Raw JSON string emitted by wait --json if available'
    value: ${{ steps.wait.outputs.json }}
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ (inputs.cache != '' && inputs.cache) || (inputs.pip-cache == 'true' && 'pip') || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install stage-signal
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        python -m pip install --upgrade pip
        VERSION=$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')
        if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
          pip install stage-signal
        else
          case "$VERSION" in
            "=="*|">="*|"<="*|"~="*|"!="*|"<"*|">"*)
              pip install "stage-signal${VERSION}"
              ;;
            *)
              pip install "stage-signal==${VERSION}"
              ;;
          esac
        fi

    - id: wait
      name: Wait for stage
      shell: bash
      env:
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_STATE: ${{ inputs.state }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_POLL: ${{ inputs.poll }}
        INPUT_NEEDS_RECLAIM: ${{ inputs.needs-reclaim }}
      run: |
        DIR="$INPUT_DIR"
        STATE="$INPUT_STATE"
        TIMEOUT="$INPUT_TIMEOUT"
        POLL="$INPUT_POLL"
        NEEDS_RECLAIM="$INPUT_NEEDS_RECLAIM"

        ARGS=("--timeout" "$TIMEOUT")
        if [ "$NEEDS_RECLAIM" = "true" ]; then
          ARGS+=("--needs-reclaim")
          if [ -n "$STATE" ] && [ "$STATE" != "terminal" ]; then
            ARGS+=("--state" "$STATE")
          fi
        else
          ARGS+=("--state" "$STATE")
        fi
        if [ -n "$POLL" ]; then
          ARGS+=("--poll" "$POLL")
        fi

        TMP_OUT=$(mktemp)

        set +e
        stage-signal --dir "$DIR" wait --json "${ARGS[@]}" > "$TMP_OUT"
        EXIT_CODE=$?
        set -e

        if [ -s "$TMP_OUT" ]; then
          cat "$TMP_OUT"
        fi

        python -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'EOF' "$TMP_OUT" "$EXIT_CODE" "$DIR" "$NEEDS_RECLAIM"
        import json, os, sys, uuid

        json_path, exit_code_str, dir_path = sys.argv[1], sys.argv[2], sys.argv[3]
        needs_reclaim_input = sys.argv[4] if len(sys.argv) > 4 else "false"
        exit_code = int(exit_code_str)
        gh_output = os.environ.get("GITHUB_OUTPUT")

        state = ""
        outcome = ""
        timed_out = "false"
        stage_id = ""
        reason = ""
        needs_reclaim = "false"
        raw_json = ""

        if os.path.exists(json_path):
            try:
                with open(json_path, "r", encoding="utf-8") as f:
                    raw_json = f.read()
                if raw_json.strip():
                    data = json.loads(raw_json)
                    state = str(data.get("state") or data.get("observed_state") or "")
                    outcome = str(data.get("outcome") or "")
                    exit_code = int(data.get("exit_code", exit_code))
                    timed_out = "true" if data.get("timeout") else "false"
                    stage_id = str(data.get("stage_id") or "")
                    reason = str(data.get("reason") or "")
                    if data.get("needs_reclaim"):
                        needs_reclaim = "true"
                    status = data.get("status") or {}
                    if isinstance(status, dict):
                        if not stage_id:
                            stage_id = str(status.get("stage_id") or "")
                        if not reason:
                            err = status.get("error") or {}
                            if isinstance(err, dict):
                                reason = str(err.get("reason") or "")
                        if needs_reclaim == "false" and status.get("needs_reclaim"):
                            needs_reclaim = "true"
            except Exception:
                pass

        if not state:
            status_file = os.path.join(dir_path, "STATUS.json")
            if os.path.exists(status_file):
                try:
                    with open(status_file, "r", encoding="utf-8") as f:
                        st = json.load(f)
                    state = str(st.get("state") or "")
                    stage_id = str(st.get("stage_id") or "")
                    if not reason:
                        err = st.get("error") or {}
                        if isinstance(err, dict):
                            reason = str(err.get("reason") or "")
                    if needs_reclaim == "false" and st.get("needs_reclaim"):
                        needs_reclaim = "true"
                except Exception:
                    pass

        if needs_reclaim_input == "true" and exit_code == 0:
            needs_reclaim = "true"

        if not outcome:
            if exit_code == 0:
                outcome = "met"
            elif exit_code == 14:
                outcome = "timeout"
                timed_out = "true"
            elif exit_code in (11, 12, 13) or (exit_code == 1 and state in ("done", "blocked", "failed", "queued")):
                outcome = "mismatch"
            else:
                outcome = "error"

        if exit_code == 14:
            timed_out = "true"
            if not reason:
                reason = "wait timed out"

        def flatten(value):
            """Collapse to a single line so a value can never forge another output.

            `stage_id` and `reason` are attacker-influenced (a stage name or an
            error string may contain newlines), and every scalar here is written
            in the `key=value` form, where an embedded newline would start a new
            GITHUB_OUTPUT entry. Flatten all of them, not just `reason`.
            """
            return " ".join(str(value).splitlines()).strip()

        state = flatten(state)
        outcome = flatten(outcome)
        timed_out = flatten(timed_out)
        stage_id = flatten(stage_id)
        reason = flatten(reason)
        needs_reclaim = flatten(needs_reclaim)

        if gh_output:
            scalars = [
                ("state", state),
                ("observed-state", state),
                ("observed_state", state),
                ("outcome", outcome),
                ("exit-code", exit_code),
                ("exit_code", exit_code),
                ("timed-out", timed_out),
                ("timed_out", timed_out),
                ("stage-id", stage_id),
                ("stage_id", stage_id),
                ("reason", reason),
                ("needs-reclaim", needs_reclaim),
                ("needs_reclaim", needs_reclaim),
            ]
            with open(gh_output, "a", encoding="utf-8") as f:
                for key, value in scalars:
                    f.write(f"{key}={flatten(value)}\n")
                if raw_json.strip():
                    # Multiline by nature: heredoc form with a random delimiter.
                    delim = f"ghdel_{uuid.uuid4().hex}"
                    f.write(f"json<<{delim}\n{raw_json.strip()}\n{delim}\n")
        EOF
        rm -f "$TMP_OUT"

        exit $EXIT_CODE
branding:
  icon: 'clock'
  color: 'blue'
