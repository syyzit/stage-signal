name: 'stage-signal wait'
description: >-
  Wait on a stage-signal stage without a preinstalled venv.
  Installs stage-signal from PyPI then runs
  `stage-signal wait --dir <dir> --state <state> --timeout <timeout>`.
  Exit codes: 0 done/OK (wait condition met), 1 generic/corrupt,
  2 bad args, 3 illegal transition, 10 running, 11 blocked,
  12 failed, 13 queued, 14 wait timeout, 15 not initialized.
inputs:
  dir:
    description: 'Stage dir (passed as --dir)'
    required: false
    default: '.stage-signal'
  state:
    description: 'State to wait for: done, blocked, failed, or terminal'
    required: false
    default: 'terminal'
  timeout:
    description: 'Wait timeout in seconds (passed as --timeout)'
    required: false
    default: '3600'
  python-version:
    description: 'Python version for actions/setup-python'
    required: false
    default: '3.12'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install stage-signal
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install stage-signal

    - name: Wait for stage
      shell: bash
      run: stage-signal wait --dir "${{ inputs.dir }}" --state "${{ inputs.state }}" --timeout "${{ inputs.timeout }}"
branding:
  icon: 'clock'
  color: 'blue'
