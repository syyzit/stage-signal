# Copy-paste GitHub Actions workflow: wait on an existing `.stage-signal/` dir
# and branch on done / blocked / failed / timeout / reclaim-needed without scraping logs.
#
# Composite action inputs (all optional):
#   dir, state, timeout, poll, needs-reclaim, python-version, version, cache,
#   cache-dependency-path, pip-cache
#
# Composite action outputs:
#   state / observed-state / observed_state
#   outcome                  (met | mismatch | timeout | error)
#   exit-code / exit_code    (0 met, 1 done-without-reclaim, 11 blocked, 12 failed, 14 timeout, …)
#   timed-out / timed_out    ("true" | "false")
#   stage-id / stage_id
#   reason                   (blocked/failed text, or timeout message)
#   needs-reclaim / needs_reclaim ("true" | "false")
#   json                     (raw wait --json payload)
#
# Pin the action ref (@v0.1.6) independently of the optional `version` pip pin.
# Composite steps use `shell: bash` (GitHub-hosted Ubuntu / macOS / Windows).
# Non-zero wait codes fail the step unless `continue-on-error: true` — that
# is what keeps 11/12/14/1 from collapsing into a generic failure so later
# `if:` branches can read `state` / `timed-out` / `needs-reclaim` / `reason`.

name: Wait for stage signal

on:
  workflow_dispatch:

jobs:
  # Job 1: Wait for stage completion (milestone / terminal state)
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - name: Wait for an existing stage
        id: wait
        continue-on-error: true
        uses: syyzit/stage-signal@v0.1.6
        with:
          dir: .stage-signal
          state: terminal
          timeout: 3600
          # poll: "5.0"
          version: "0.1.6"

      - name: Stage done
        if: steps.wait.outputs.state == 'done'
        run: |
          echo "done stage_id=${{ steps.wait.outputs.stage-id }}"
          echo "exit_code=${{ steps.wait.outputs.exit-code }}"

      - name: Stage blocked
        if: steps.wait.outputs.state == 'blocked'
        run: |
          echo "blocked stage_id=${{ steps.wait.outputs.stage-id }}"
          echo "reason=${{ steps.wait.outputs.reason }}"

      - name: Stage failed
        if: steps.wait.outputs.state == 'failed'
        run: |
          echo "failed stage_id=${{ steps.wait.outputs.stage-id }}"
          echo "reason=${{ steps.wait.outputs.reason }}"

      - name: Wait timed out
        if: steps.wait.outputs.timed-out == 'true'
        run: |
          echo "timeout observed_state=${{ steps.wait.outputs.state }}"
          echo "reason=${{ steps.wait.outputs.reason }}"

      # Optional: fail the job unless the stage reached done.
      # Waiting for `terminal` treats blocked/failed as outcome=met (exit 0);
      # branch on `state` (and `timed-out`) rather than `outcome` or the raw
      # wait exit code alone.
      - name: Fail unless done
        if: steps.wait.outputs.state != 'done'
        run: |
          echo "not done: state=${{ steps.wait.outputs.state }} reason=${{ steps.wait.outputs.reason }}"
          exit 1

  # Job 2: CI Reclaim Watchdog gate (`needs-reclaim: true`)
  # Polls until needs_reclaim is true (running + DEAD_PID or STALE_HEARTBEAT).
  # Terminal without reclaim fails closed: done -> 1, blocked -> 11, failed -> 12.
  # Timeout -> 14.
  watchdog-reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - name: Wait for reclaim signal
        id: wait
        continue-on-error: true
        uses: syyzit/stage-signal@v0.1.6
        with:
          dir: .stage-signal
          needs-reclaim: true
          timeout: 3600
          # poll: "5.0"
          version: "0.1.6"

      # Branch 1: Reclaim needed (outcome == 'met', needs-reclaim == 'true', exit-code 0)
      - name: Reclaim needed
        if: steps.wait.outputs.needs-reclaim == 'true'
        run: |
          echo "reclaim-needed stage_id=${{ steps.wait.outputs.stage-id }}"
          echo "state=${{ steps.wait.outputs.state }}"
          # Optional: fail+clear to idle queued (or --keep-failed to audit then clear)
          # stage-signal --dir .stage-signal reclaim --reason "CI watchdog reclaim"

      # Branch 2: Watchdog timed out (timed-out == 'true', outcome == 'timeout', exit-code 14)
      - name: Watchdog timed out
        if: steps.wait.outputs.timed-out == 'true'
        run: |
          echo "timeout observed_state=${{ steps.wait.outputs.state }}"
          echo "reason=${{ steps.wait.outputs.reason }}"

      # Branch 3: Terminal without reclaim (outcome == 'mismatch', fail-closed: done -> 1, blocked -> 11, failed -> 12)
      - name: Terminal without reclaim
        if: steps.wait.outputs.outcome == 'mismatch'
        run: |
          echo "terminal-without-reclaim state=${{ steps.wait.outputs.state }}"
          echo "exit_code=${{ steps.wait.outputs.exit-code }}"
          echo "reason=${{ steps.wait.outputs.reason }}"

      - name: Terminal done without reclaim
        if: steps.wait.outputs.outcome == 'mismatch' && steps.wait.outputs.state == 'done'
        run: |
          echo "done without reclaim: stage_id=${{ steps.wait.outputs.stage-id }}"

      - name: Terminal blocked or failed without reclaim
        if: steps.wait.outputs.outcome == 'mismatch' && (steps.wait.outputs.state == 'blocked' || steps.wait.outputs.state == 'failed')
        run: |
          echo "terminal failure without reclaim: state=${{ steps.wait.outputs.state }} reason=${{ steps.wait.outputs.reason }}"
